name: build-images

on:
  push:
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Buildx is required for all Docker builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # QEMU is only needed for multi-arch builds (main branch)
      - name: Set up QEMU
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      # Docker Hub login is only required when pushing the image (main branch)
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: softwareimprovementgroup
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set branch slug
        if: github.ref != 'refs/heads/main'
        run: echo "BRANCH_SLUG=$(echo "${{ github.head_ref || github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_ENV

      - name: Build Docker image (branch / PR validation)
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: softwareimprovementgroup/sigrid-report-generator:branch-${{ env.BRANCH_SLUG }}

      - name: Read application version
        if: github.ref == 'refs/heads/main'
        run: echo "APP_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> $GITHUB_ENV

      # One build, two tags: :latest moves to each new release, :<version> stays with the image it was built for
      - name: Build and push Docker image (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            softwareimprovementgroup/sigrid-report-generator:latest
            softwareimprovementgroup/sigrid-report-generator:${{ env.APP_VERSION }}
