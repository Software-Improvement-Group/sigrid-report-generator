name: Compatibility Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  compatibility-check:
    name: "Python compatibility check"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.14' ]
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v6

      - name: "Set up uv (Python ${{ matrix.python-version }})"
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          cache-dependency-glob: "pylock.toml"

      - name: "Install dependencies"
        run: |
          uv pip install -r pylock.toml && uv pip install --no-deps -e .

      - name: "Check syntax and imports"
        run: |
          python -m compileall -f .
          python -c "import report_generator; print('Import successful for Python ${{ matrix.python-version }}')"