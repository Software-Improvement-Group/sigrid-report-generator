[metadata]
name = report-generator
version = 1.6.0
author = Software Improvement Group (SIG)
author_email = support@softwareimprovementgroup.com
description = Generate Sigrid reports
long_description_content_type = text/markdown
long_description = file: README.md
project_urls =
    Homepage = https://github.com/Software-Improvement-Group/sigrid-report-generator
    Source = https://github.com/Software-Improvement-Group/sigrid-report-generator
license_files =
    LICENSE
    LICENSES/MIT-matplotlib-extra.txt
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    License :: OSI Approved :: Apache Software License
keywords =
    report
    powerpoint
    excel
    word
    pdf

[options]
package_dir =
    = src
packages = find:
include_package_data = True
python_requires = >=3.11
install_requires =
    pyyaml>=6.0.3
    click>=8.4.2
    pillow>=12.3.0
    lxml>=6.1.0
    python-pptx>=1.0.2
    python-docx>=1.2.0
    pygments>=2.20.0
    requests>=2.33.0
    pyjwt>=2.10.0
    importlib-resources>=6.5.2
    numpy>=2.4.6
    tqdm>=4.67.1
    pandas>=3.0.3
    matplotlib>=3.11.1
    squarify>=0.4.4
    platformdirs>=4.9.4

[options.extras_require]
test =
    pytest==8.3.3
    pytest-mock==3.14.0
    freezegun==1.5.1
    ruff==0.15.8
    import-linter==2.1

[options.package_data]
report_generator.presets =
    templates/*

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    report-generator=report_generator.cli:run
